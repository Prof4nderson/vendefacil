services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery}
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda o schema + dados iniciais na primeira subida do container
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # App (frontend + backend servidos juntos)
  app:
    build: .
    container_name: delivery-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # O app fala com o banco pelo nome do serviço dentro da rede do compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery}:${POSTGRES_PASSWORD:-delivery}@postgres:5432/${POSTGRES_DB:-delivery}
      PGSSL_DISABLE: "true"
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
