version: "3.8"

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vendefacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD forte no .env}
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda o schema na primeira inicialização do volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vendefacil-network

  # App (Frontend + Backend)
  app:
    build: .
    container_name: vendefacil-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD forte no .env}@postgres:5432/${POSTGRES_DB:-delivery}
      PGSSLMODE: "disable"
      PORT: "3000"
      HOST: "0.0.0.0"
      ACCOUNT_SESSION_SECRET: ${ACCOUNT_SESSION_SECRET:-}
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET:-}
      SYSADM_SESSION_SECRET: ${SYSADM_SESSION_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mail.professor-anderson.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-VendeFácil}
    ports:
      - "${APP_PORT:-3011}:3000"
    networks:
      - vendefacil-network

volumes:
  postgres-data:

networks:
  vendefacil-network:
    driver: bridge
